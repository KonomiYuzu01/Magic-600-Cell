[package]
name = "c600-session"
description = "The session store below the language: journal, revisions, commits, undo, branches and program jobs (LP2, M6)"
version.workspace = true
edition.workspace = true
publish.workspace = true
# The session lock takes std's `File::try_lock`, stable since Rust 1.89. This is that call's lower bound; the crate is
# built and tested with the current stable toolchain only.
rust-version = "1.89"

[dependencies]
# The command layer's `Store` and `Reopen`, which `JournalStore` implements (KN5 over KN4's journal).
c600-command = { path = "../c600-command" }
c600-digest = { path = "../c600-digest" }
# The document service's script compile (`documents`): the editor services diagnose a `.6cs` and run nothing.
c600-editor = { path = "../c600-editor" }
# The document service's logs (`documents`, LP4-14): the session's history as a `.c600log`, its compile, and the 0.4 and
# MPUlt interchange. `c600-log` itself keeps no path to `c600-run`.
c600-log = { path = "../c600-log" }
# The facts envelope reads into chapter 06's evidence graph and its word function (`persist::facts`).
c600-evidence = { path = "../c600-evidence" }
c600-ir = { path = "../c600-ir" }
c600-kernel = { path = "../c600-kernel" }
# The session lock file's open, the platform layer of RPI.52 (`c600-platform`).
c600-platform = { path = "../c600-platform" }
c600-run = { path = "../c600-run" }

[features]
# `disk::MemDisk`, the memory disk, for tests only: a product store takes the session lock on a file system
# (KN4.1). A test that needs the memory disk enables this feature in its dev-dependencies.
mem-disk = []

[dev-dependencies]
# The crate's own tests use the memory disk.
c600-session = { path = ".", features = ["mem-disk"] }
# The job tests run checked surface programs.
c600-check = { path = "../c600-check" }
# The jumbling tests (`persist_jumble.rs`) read the I_a menu in the exact model, as c600-command's tests do.
c600-jumble = { path = "../c600-jumble" }
c600-syntax = { path = "../c600-syntax" }
