[package]
name = "c600-render"
description = "The display host's bridge to the S-A2 renderer core: c600-display's Backend over ABI 5 of renderer/core/include/sa2_interop.h through a safe call interface, with a fake core for headless tests; the C function table is in renderer/bridge; user stages as HLSL under m600-stage-hlsl/1 with their binary32 CPU reference (C9)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
c600-check = { path = "../c600-check" }
c600-digest = { path = "../c600-digest" }
c600-display = { path = "../c600-display" }
c600-ir = { path = "../c600-ir" }
c600-kernel = { path = "../c600-kernel" }
c600-syntax = { path = "../c600-syntax" }
