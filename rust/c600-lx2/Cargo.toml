[package]
name = "c600-lx2"
description = "LX-2's metered, forced-kill and allocator-ceiling trials, alone and in a session, against a given runtime child binary and the injection device; measurement tooling, never shipped (C9)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "c600-lx2-faults"
path = "src/main.rs"

# The fault-injection child of option (a): c600-runtime's child under a ceiling allocator. Never shipped.
[[bin]]
name = "c600-lx2-child"
path = "src/bin/c600-lx2-child.rs"

[dependencies]
c600-check = { path = "../c600-check" }
c600-command = { path = "../c600-command" }
c600-digest = { path = "../c600-digest" }
c600-kernel = { path = "../c600-kernel" }
c600-run = { path = "../c600-run" }
c600-runtime = { path = "../c600-runtime" }
c600-session = { path = "../c600-session" }
c600-tools = { path = "../c600-tools" }
