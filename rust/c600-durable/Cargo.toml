[package]
name = "c600-durable"
description = "LP3 C7's durable conformance cases: CT-RTE-08's persisted word, CT-EV3-07 and CT-LB2-03's work sheets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]

# The crate holds tests only. They drive KN5's command layer over M6's journal, M6's session store, C4's module
# closures, C5's provenance reader and the view model behind the layer's view rows through their public APIs.
[dev-dependencies]
c600-check = { path = "../c600-check" }
c600-command = { path = "../c600-command" }
c600-digest = { path = "../c600-digest" }
c600-kernel = { path = "../c600-kernel" }
c600-module = { path = "../c600-module" }
c600-run = { path = "../c600-run" }
c600-session = { path = "../c600-session", features = ["mem-disk"] }
c600-syntax = { path = "../c600-syntax" }
c600-tools = { path = "../c600-tools" }
c600-view = { path = "../c600-view" }
