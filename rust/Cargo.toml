# The Rust workspace of 600 Cell Script (LP2). See README.md.
[workspace]
resolver = "2"
members = [
    "c600-ir", "c600-check", "c600-digest", "c600-syntax", "c600-run", "c600-kernel", "c600-session",
    "c600-evidence", "c600-command", "c600-view", "c600-display", "c600-module", "c600-runtime", "c600-tools",
    "c600-input", "c600-jumble", "c600-durable", "c600-a2-filter", "c600-repr", "c600-jumble-tool",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

# Debug and test builds optimize the jumbling and kernel crates and the external crates; overflow checks and debug
# assertions stay on. Unoptimized, M8's observation tests alone ran for minutes, and the Windows CI shard that runs
# `tests/test_language_rust.py` went over its time limit.
[profile.dev.package.c600-kernel]
opt-level = 2

[profile.dev.package.c600-jumble]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
