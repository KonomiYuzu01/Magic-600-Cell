[package]
name = "c600-docs"
description = "EV5's reference docs and principle records for 600 Cell Script: reference entries from checked metadata, decompositions from the IR's call graph, PrincipleRecord admission, explanations with chapter 06's words, lazy provenance and forks (LP4-10)"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The plan's five crates (LP4 plan, section 3, selection 1) and the evidence library, whose word function the
# explanation words come from (EV5.13). The generator runs no program: the fixtures run in the tests.
[dependencies]
c600-check = { path = "../c600-check" }
c600-digest = { path = "../c600-digest" }
c600-evidence = { path = "../c600-evidence" }
c600-ir = { path = "../c600-ir" }
c600-module = { path = "../c600-module" }
c600-syntax = { path = "../c600-syntax" }

# The fixtures run each tool's and library module's instance on the real geometry: the 600-cell-Full kernel and the
# command layer through the tools' host bridge, the jumbling engine, and the interpreter.
[dev-dependencies]
c600-command = { path = "../c600-command" }
c600-jumble = { path = "../c600-jumble" }
c600-jumble-tool = { path = "../c600-jumble-tool" }
c600-kernel = { path = "../c600-kernel" }
c600-library = { path = "../c600-library" }
c600-repr = { path = "../c600-repr" }
c600-run = { path = "../c600-run" }
c600-tools = { path = "../c600-tools" }
