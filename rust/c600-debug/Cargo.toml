[package]
name = "c600-debug"
description = "EV2's read-only debugger, replay and cost profile for 600 Cell Script: stepping, inspection, word ranges, replay with mismatch reporting, journal travel and checker traces (LP4-5, LP4-6)"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The debugger reads and never writes (EV2.1, EV2.8): no path to the command layer, the session store, the runtime or
# the tools. It steps the interpreter (`c600-run`) through its gate, reads journal rows through `journal::JournalRows`,
# which the host implements, and reads source maps from `c600-syntax`. `tests/dependencies.rs` reads these manifests and
# fails on any other path dependency.
[dependencies]
c600-digest = { path = "../c600-digest" }
c600-ir = { path = "../c600-ir" }
c600-run = { path = "../c600-run" }
c600-syntax = { path = "../c600-syntax" }

[dev-dependencies]
# The tests check the source programs they step and replay, as the host's module check does.
c600-check = { path = "../c600-check" }
