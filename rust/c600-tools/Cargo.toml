[package]
name = "c600-tools"
description = "The built-in tools' 600 Cell Script sources, their solving-profile admission, the runner's recipe expansion and the host bridge onto the command layer (LP3, C5)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
c600-check = { path = "../c600-check" }
c600-command = { path = "../c600-command" }
# EV2's debugger (`debug`, LP4-5 and LP4-6): its journal rows over the command layer and its bound stepped runs.
c600-debug = { path = "../c600-debug" }
c600-digest = { path = "../c600-digest" }
c600-display = { path = "../c600-display" }
c600-ir = { path = "../c600-ir" }
c600-kernel = { path = "../c600-kernel" }
# A user module's runs, bound wholly to one checked version (`modules`, EV1.11; LP4-2).
c600-module = { path = "../c600-module" }
c600-run = { path = "../c600-run" }
c600-runtime = { path = "../c600-runtime" }
c600-syntax = { path = "../c600-syntax" }
c600-view = { path = "../c600-view" }

[dev-dependencies]
# CT-EV1-04's key route: a key bound to a user module's overlay row (tests/ct_ev1_04_routes.rs).
c600-input = { path = "../c600-input" }
c600-library = { path = "../c600-library" }
