# Headless checks on a GitHub-hosted Windows runner (owner decision, 3 October 2026:
# docs/wiki/decisions/owner-decisions-2026-10-03.md). A pass is not Windows/DirectX,
# input, long-session or performance evidence; those checks still run on the owner's
# machine. The runner has no personal data and gets no secrets.
name: Windows headless checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out the exact committed bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tests check evidence commits and file history

      - name: Set up the pinned CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          architecture: x64

      - name: Install the pinned engine environment (hash-checked wheels only)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r tools/python/engine.txt

      - name: Print the interpreter identity
        run: |
          python -c "import numpy,platform,struct;print('numpy',numpy.__version__,platform.python_implementation().lower(),platform.python_version(),struct.calcsize('P')*8)"

      - name: Run the headless checks
        # The default temp path holds an 8.3 short name (RUNNER~1), which the link checks
        # read as a link; use the runner's own long temp path, as on a normal machine.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python tools/ci/run_headless.py
