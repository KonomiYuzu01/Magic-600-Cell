# Headless checks on GitHub-hosted Windows runners (owner decision, 3 October 2026:
# docs/wiki/decisions/owner-decisions-2026-10-03.md). A pass is not Windows/DirectX,
# input, long-session or performance evidence; those checks still run on the owner's
# machine. The runners have no personal data and get no secrets.
#
# The plan job chooses the mode (tools/ci/run_headless.py): a pull request that changes
# only Markdown in the documentation trees runs the light checks in one shard; anything
# else, and every push to main, runs all checks in time-balanced parallel shards. The
# headless job passes only when the plan and every shard passed.
name: Windows headless checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check out the exact committed bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the mode comes from the diff against the pull request's base

      - name: Choose the mode and the shards
        id: plan
        env:
          RUN_HEADLESS_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/run_headless.py --plan-github >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    name: shard ${{ matrix.shard }} of ${{ needs.plan.outputs.count }}
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Check out the exact committed bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tests check evidence commits and file history

      - name: Set up the pinned CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          architecture: x64

      - name: Install the pinned engine environment (hash-checked wheels only)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r tools/python/engine.txt

      - name: Print the interpreter identity
        run: |
          python -c "import numpy,platform,struct;print('numpy',numpy.__version__,platform.python_implementation().lower(),platform.python_version(),struct.calcsize('P')*8)"

      - name: Run the headless checks of this shard
        # The default temp path keeps its 8.3 short name (RUNNER~1) on purpose: the tests
        # must pass under it. The shard recomputes the mode from the same diff and fails if it
        # differs from the plan's.
        env:
          RUN_HEADLESS_BASE: ${{ github.event.pull_request.base.sha }}
        run: python tools/ci/run_headless.py --shard ${{ matrix.shard }}/${{ needs.plan.outputs.count }} --expect-mode ${{ needs.plan.outputs.mode }}

  headless:
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the plan and every shard to pass
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "plan: $PLAN, shards: $SHARDS"
          test "$PLAN" = success && test "$SHARDS" = success
