# The Rust tests of 600 Cell Script on a GitHub-hosted Linux runner: the headless Linux leg of
# M8's acceptance (LP2 plan, M8: PHS.19's acceptance on Windows and headless Linux). Owner
# decision, 16 November 2026 (docs/wiki/decisions/owner-decisions-2026-11-16-lp2-questions.md):
# `cargo test --locked --offline` runs in rust/ on ubuntu-24.04, and nothing is installed on the
# owner's machine. The approved crates are vendored (rust/.cargo/config.toml), so the tests need
# no network after the checkout. The runner's preinstalled Rust is used, as on the Windows shards.
# A pass is headless Linux evidence only, not Windows/DirectX, input, long-session or performance
# evidence. The runner has no personal data and gets no secrets. `--no-fail-fast` runs every test
# target after a failure, so one run reports every failing target.
#
# The J1 job runs the Python comparisons of the Rust jumbling candidate with J1 on Linux as well
# (PHS.19's cross-platform item). They are the six `tests/test_jumbling_rust_*.py` checks that
# tools/ci/run_headless.py runs on the Windows shards, here one runner per check. Each runner uses
# the Windows shards' pinned CPython, hash-checked NumPy wheels, environment and time limit for one
# check, and builds the release adapter with the locked, vendored crates. Each system compares the
# candidate with J1 on the same pinned inputs and keys; the LP2 workflow (lp2-full.yml) compares the
# two systems' payloads with each other.
#
# CI has two tiers (owner, 26 November 2026); the plan job selects the jobs with
# tools/ci/run_headless.py --plan-github.
# - The fast tier runs on every pull request and should finish in about 10 to 15 minutes.
#   `cargo test` runs only for the workspace members that hold a changed file, one `-p` per
#   member, or the whole workspace when a file of the workspace itself changes (rust/Cargo.toml,
#   rust/Cargo.lock, rust/.cargo/, rust/vendor/ and the like); a change outside rust/ runs no
#   cargo test. A J1 comparison runs when the pull request selects its check (owner, 19 November
#   2026) and its recorded time on the Windows runner is at most 180 seconds
#   (FAST_BUDGET_SECONDS); the slower ones wait for the full tier.
# - The full tier runs `cargo test` on the whole workspace and every J1 comparison. It runs on
#   every push to main, every night, for a pull request that changes the CI itself, and on a
#   manual run with the tier input `full` (the default), so an author can run it on a branch.
#   Nobody waits for it. A manual run with the tier `fast` selects the jobs from the branch's
#   diff against main.
name: Linux Rust tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *" # nightly full run on main
  workflow_dispatch:
    inputs:
      tier:
        description: "full runs every job; fast runs the jobs of the branch's changes against main"
        type: choice
        options: [full, fast]
        default: full

permissions:
  contents: read

concurrency:
  group: linux-rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      packages: ${{ steps.plan.outputs.packages }}
      j1: ${{ steps.plan.outputs.j1 }}
    steps:
      - name: Check out the exact committed bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the selection comes from the diff against the pull request's base
          filter: blob:none

      - name: Select the jobs
        id: plan
        env:
          RUN_HEADLESS_BASE: ${{ github.event.pull_request.base.sha }}
          RUN_HEADLESS_TIER: ${{ inputs.tier }} # empty except on a manual run
        run: |
          python3 tools/ci/run_headless.py --plan-github > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"

  cargo-test:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    name: cargo test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out the exact committed bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Print the toolchain identity
        run: |
          uname -srm
          rustc --version --verbose
          cargo --version

      - name: Run the Rust tests with the locked, vendored crates
        env:
          # `--workspace`, or one `-p` per changed member in the fast tier; split into words on purpose.
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: cargo test --locked --offline --no-fail-fast $PACKAGES

  j1:
    needs: plan
    if: needs.plan.outputs.j1 != '[]'
    name: J1 comparison, ${{ matrix.check }} (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The environment tools/ci/run_headless.py gives each check on the Windows shards.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.j1) }}
    steps:
      - name: Check out the exact committed bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          architecture: x64

      - name: Install the pinned engine environment (hash-checked wheels only)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r tools/python/engine.txt

      - name: Print the toolchain identity
        run: |
          uname -srm
          python -c "import numpy,platform,struct;print('numpy',numpy.__version__,platform.python_implementation().lower(),platform.python_version(),struct.calcsize('P')*8)"
          rustc --version --verbose
          cargo --version

      - name: Build the release adapter with the locked, vendored crates
        working-directory: rust
        run: cargo build --release --locked --offline -p c600-jumble --bin c600-jumble-adapter

      - name: Compare the candidate with J1
        # The Windows shards' limit for one check (TIME_LIMIT_SECONDS in tools/ci/run_headless.py).
        timeout-minutes: 20
        run: python tests/test_jumbling_rust_${{ matrix.check }}.py
