# Taste Lab seed plan (default). The first fetch copies this file to
# work/loop-memory/tastelab/library/seeds.yaml; edit that copy, not this one.
#
# kind:      focus (a style the owner explores), adjacency (bridges between styles)
#            or control (neutral reference images).
# target:    images to fetch for the category in the initial pool; terms share it.
# tier:      B forces tier B (private reference) on every image of the category.
# sources:   adapters to search, from the approved list in `sources` below.
# terms:     search terms; a term may give a per-source query, for example booru tags.
# adjacent:  candidate terms that the rating window may propose after every 100
#            ratings; nothing is fetched until the owner ticks a proposal.
# The category is a label for reports and quotas, never a model feature.

version: 1
# Minimum image-to-term similarity (same embedding model) for a search result to be
# kept; 0 keeps everything the source returns. Measured on 10 October 2026 over 118
# class A candidates: median 0.088, 90th percentile 0.153; 0.20 kept 5 of them and
# 0.10 keeps 44.
relevance_min: 0.10

sources:            # approved adapters; set one to false to stop using it
  wikimedia: true
  met: true
  aic: true
  nasa: true
  openverse: true
  archive: true
  demozoo: true
  safebooru: true

categories:
  # Terms checked against the live sources on 10 October 2026, and later that day against
  # a visual audit of the fetched images: terms whose results were mostly unrelated
  # (tutorials, diagrams, other meanings of a word) were dropped or given quoted
  # per-source queries.
  gaming:
    kind: focus
    target: 300
    sources: [wikimedia, openverse, archive, demozoo]
    terms:
      - {text: pixel art, wikimedia: '"pixel art" -tutorial -example -aliasing -jaggie -shading -timelapse -icon'}
      - PS1 low poly
      - arcade cabinet
      - JRPG menu UI
      - Dreamcast
      - {text: GameCube console, wikimedia: '"GameCube" console', openverse: GameCube console}
      - Game Boy
      - {text: sprite sheet, wikimedia: '"pixel art" sprite -logo -icon', openverse: pixel art sprites}
      - {text: isometric pixel art, wikimedia: '"isometric" "pixel art" -tutorial -example -shading -camera -"low-res"'}
      - {text: Sega Saturn console, wikimedia: '"Sega Saturn" -logo', openverse: Sega Saturn console}
      - CRT scanlines
      - chiptune album art
      - 16-bit RPG town
      - handheld console design
      - {text: Virtual Boy console, wikimedia: '"Virtual Boy"', openverse: Nintendo Virtual Boy}
      - {text: Nintendo 64 console, wikimedia: '"Nintendo 64" console', openverse: Nintendo 64 console}
      - {text: video arcade interior, wikimedia: '"video arcade" interior', openverse: video game arcade}
      - {text: Dance Dance Revolution arcade machine, wikimedia: '"Dance Dance Revolution" arcade', openverse: Dance Dance Revolution arcade}
      - {text: beatmania arcade machine, wikimedia: beatmania arcade, openverse: beatmania arcade}
    adjacent: [Neo Geo console, PC Engine console, Famicom, pinball machine playfield]

