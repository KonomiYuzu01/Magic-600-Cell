[package]
name = "lx5-crate-candidate"
version = "0.0.0"
edition = "2021"
publish = false

# A workspace of its own, so no manifest above this folder can claim it.
[workspace]

[[bin]]
name = "candidate"
path = "candidate.rs"

[dependencies]
num-bigint = { version = "=0.5.1", default-features = false, features = ["std"] }
num-integer = { version = "=0.1.47", default-features = false, features = ["std"] }
num-traits = { version = "=0.2.19", default-features = false, features = ["std"] }

# LX-5 builds its own Rust candidate with `rustc -O -C debuginfo=0`, which is opt-level 2.
[profile.release]
opt-level = 2
debug = false
