; C9 U4: route B's window for the acceptance host (prepare_host.py --route surface copies this file into the
; build's project/, where Godot reads it over the verbatim project.godot). The settings are the product shell's
; (renderer/shell/project/project.godot): a transparent window, so the core's DirectComposition layer beneath
; Godot's content shows through, and vsync on, as the shell presents. Level2.RequireSurfaceWindow checks them.

[display]

window/size/transparent=true
window/per_pixel_transparency/allowed=true
window/vsync/vsync_mode=1

[rendering]

viewport/transparent_background=true
environment/defaults/default_clear_color=Color(0, 0, 0, 0)
