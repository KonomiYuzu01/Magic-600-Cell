# The foreign half of C9's renderer bridge: the C function table of the S-A2 core's ABI (renderer/core/include/
# sa2_interop.h) and its implementation of c600-render's CoreAbi. It stays outside the language workspace
# (rust/Cargo.toml), because CT-RPI-01 keeps every member of that workspace free of unsafe code and foreign
# declarations. The product shell links this crate, loads sa2_interop.dll and hands over the table and a context.
[package]
name = "c600-render-ffi"
description = "The C function table of the S-A2 renderer core's ABI behind c600-render's CoreAbi, for the product shell (C9)"
version = "0.0.0"
edition = "2021"
publish = false

# A workspace of its own, so that it is no member of rust/Cargo.toml's. Its other members are the shell's native host
# library (host/, c600-shell-host), the shell's editor library of LP4-3's write-check-run flow (editor/,
# c600-shell-editor) and LX-4's editor library (lx4/, c600-shell-lx4), which share the lockfile and the vendored
# crates.
[workspace]
members = [".", "editor", "host", "lx4"]

[dependencies]
c600-render = { path = "../../rust/c600-render" }

[dev-dependencies]
c600-digest = { path = "../../rust/c600-digest" }
c600-display = { path = "../../rust/c600-display" }
c600-kernel = { path = "../../rust/c600-kernel" }

# As in rust/Cargo.toml: the shared host scenario loads the shipped model, which is slow unoptimized. Here every
# crate but this one is outside the workspace, so "*" covers the kernel and the jumbling crate too. Debug info is kept
# small as in rust/Cargo.toml (owner, 20 November 2026): line tables only for this workspace's crates, none for the rest.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
