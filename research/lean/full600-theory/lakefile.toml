name = "archon-full600-theory"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ArchonFull600Theory"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "ArchonFull600Theory"
