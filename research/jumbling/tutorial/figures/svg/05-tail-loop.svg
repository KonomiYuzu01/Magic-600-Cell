<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#172b3a" aria-labelledby="figure-title figure-description" height="789" viewBox="0 0 1200 789"><title id="figure-title">Figure 5.1: One pass through the tail's units, rules and gates</title><desc id="figure-description">One pass of the tail loop, from the step budget through the unit census, the rules per unit and the gate, to a played step, the fallback or probe, or the stuck record</desc><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526574" /></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8054a2" /></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83" /></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b43c4c" /></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2469a0" /></marker></defs><rect fill="#ffffff" height="789" width="1200" x="0" y="0" /><text font-size="23" font-weight="600" text-anchor="start" x="40" y="40">Figure 5.1: One pass through the tail's units, rules and gates</text><line stroke="#cbd5dd" stroke-width="1.5" x1="40" x2="1160" y1="60" y2="60" /><rect fill="#f3f6f8" height="54" rx="6" stroke="#cbd5dd" width="256" x="40" y="90" /><text font-size="15" text-anchor="middle" x="168" y="122.25">zero_bad</text><rect fill="#f3f6f8" height="54" rx="6" stroke="#cbd5dd" width="256" x="328" y="90" /><text font-size="15" text-anchor="middle" x="456" y="122.25">pure</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="298" x2="324" y1="117" y2="117" /><rect fill="#f3f6f8" height="54" rx="6" stroke="#cbd5dd" width="256" x="616" y="90" /><text font-size="15" text-anchor="middle" x="744" y="122.25">close</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="586" x2="612" y1="117" y2="117" /><rect fill="#f3f6f8" height="54" rx="6" stroke="#cbd5dd" width="256" x="904" y="90" /><text font-size="15" text-anchor="middle" x="1032" y="122.25">t1prime</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="874" x2="900" y1="117" y2="117" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="700" x="40" y="176" /><text font-size="15" text-anchor="middle" x="390" y="204.75">Step budget reached?</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="199.5" y2="199.5" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="340" x="820" y="176" /><text font-size="15" text-anchor="middle" x="990" y="204.75">yes → tail and run end budget</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="227" y2="248" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="700" x="40" y="251" /><text font-size="15" text-anchor="middle" x="390" y="279.75">Census units in the current state and read them in unit order</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="274.5" y2="274.5" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="340" x="820" y="251" /><text font-size="15" text-anchor="middle" x="990" y="279.75">census error → run error</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="302" y2="323" /><rect fill="#f3f6f8" height="68" rx="6" stroke="#cbd5dd" width="700" x="40" y="326" /><text font-size="15" text-anchor="middle" x="390" y="365.25">For this unit: try rules in the order above, testing each candidate's gate</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="360" y2="360" /><rect fill="#f3f6f8" height="68" rx="6" stroke="#cbd5dd" width="340" x="820" y="326" /><text font-size="15" text-anchor="middle" x="990" y="354.75">rejected candidate / failed attempt</text><text font-size="15" text-anchor="middle" x="990" y="375.75">→ next rule</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="398" y2="419" /><rect fill="#f3f6f8" height="68" rx="6" stroke="#cbd5dd" width="700" x="40" y="422" /><text font-size="15" text-anchor="middle" x="390" y="461.25">First unit with a candidate whose gate passed</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="456" y2="456" /><rect fill="#f3f6f8" height="68" rx="6" stroke="#cbd5dd" width="340" x="820" y="422" /><text font-size="15" text-anchor="middle" x="990" y="450.75">play, verify, record; next pass at</text><text font-size="15" text-anchor="middle" x="990" y="471.75">the new state</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="494" y2="515" /><rect fill="#f3f6f8" height="68" rx="6" stroke="#cbd5dd" width="700" x="40" y="518" /><text font-size="15" text-anchor="middle" x="390" y="546.75">No candidate: if a unit exists and fallback length is positive, probe the</text><text font-size="15" text-anchor="middle" x="390" y="567.75">first unit</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="552" y2="552" /><rect fill="#f3f6f8" height="68" rx="6" stroke="#cbd5dd" width="340" x="820" y="518" /><text font-size="15" text-anchor="middle" x="990" y="546.75">development: play a found word;</text><text font-size="15" text-anchor="middle" x="990" y="567.75">acceptance: record probe only</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="590" y2="611" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="700" x="40" y="614" /><text font-size="15" text-anchor="middle" x="390" y="663.75">Still no candidate: save the stuck record and all attempts at this state</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="658.5" y2="658.5" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="340" x="820" y="614" /><text font-size="15" text-anchor="middle" x="990" y="642.75">timed-out attempt → tail timeout /</text><text font-size="15" text-anchor="middle" x="990" y="663.75">run budget; otherwise tail stuck /</text><text font-size="15" text-anchor="middle" x="990" y="684.75">run stuck</text><text fill="#526574" font-size="13" text-anchor="start" x="40" y="763">Committed research evidence · provisional colours · no Windows/DirectX or performance claim</text><metadata>{"command":"python3 -I -B research/jumbling/tutorial/figures/diagrams.py --only 05-tail-loop","figure":"05-tail-loop","inputs":{"research/jumbling/tutorial/05-tail.md":"1ce007e52c09437cea0a753924d96389e623d15a337bd7cebec8f67e12bc6f24","research/jumbling/tutorial/figures/diagrams.py":"4999331eb3c77ec66b6af2cf989eaeaca63d2046e00340409826223b231e8008","research/jumbling/tutorial/records/ch05-examples.json":"a21d9dbdb6f0c7fa7f08d2de86a9a507683a94535866a7b599f52c20def7866b"},"notes":[],"tool":"Python 3.13.16; standard library SVG writer"}</metadata></svg>
