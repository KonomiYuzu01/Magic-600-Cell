="48" rx="6" stroke="#cbd5dd" width="96" x="932" y="146" /><text font-size="15" text-anchor="middle" x="980" y="175.25">A</text><rect fill="#f3f6f8" height="48" rx="6" stroke="#cbd5dd" width="96" x="1037" y="291" /><text font-size="15" text-anchor="middle" x="1085" y="320.25">X</text><rect fill="#f3f6f8" height="48" rx="6" stroke="#cbd5dd" width="96" x="827" y="291" /><text font-size="15" text-anchor="middle" x="875" y="320.25">Y</text><text font-size="16" text-anchor="middle" x="220" y="398">seed c</text><text font-size="16" text-anchor="middle" x="600" y="398">star(X) = u_X⁻¹ · c · u_X</text><text font-size="16" text-anchor="middle" x="980" y="398">star(X)⁻¹ · star(Y)</text><text font-size="15" text-anchor="start" x="40" y="452">u_X is the execution-tree path from C to X. A star moves A → B → X → A; playing star(X)⁻¹ and then star(Y) gives A → X → Y → A.</text><rect fill="#f3f6f8" height="38" stroke="#cbd5dd" width="300" x="40" y="493" /><text font-size="14" font-weight="600" text-anchor="start" x="50" y="517">Orbit-6 example</text><rect fill="#f3f6f8" height="38" stroke="#cbd5dd" width="300" x="340" y="493" /><text font-size="14" font-weight="600" text-anchor="start" x="350" y="517">Recorded factor length</text><rect fill="#f3f6f8" height="38" stroke="#cbd5dd" width="520" x="640" y="493" /><text font-size="14" font-weight="600" text-anchor="start" x="650" y="517">Role</text><rect fill="#ffffff" height="38" stroke="#cbd5dd" width="300" x="40" y="531" /><text font-size="14" text-anchor="start" x="50" y="555">factor 0</text><rect fill="#ffffff" height="38" stroke="#cbd5dd" width="300" x="340" y="531" /><text font-size="14" text-anchor="start" x="350" y="555">406</text><rect fill="#ffffff" height="38" stroke="#cbd5dd" width="520" x="640" y="531" /><text font-size="14" text-anchor="start" x="650" y="555">star(X)⁻¹</text><rect fill="#f3f6f8" height="38" stroke="#cbd5dd" width="300" x="40" y="569" /><text font-size="14" text-anchor="start" x="50" y="593">factor 1</text><rect fill="#f3f6f8" height="38" stroke="#cbd5dd" width="300" x="340" y="569" /><text font-size="14" text-anchor="start" x="350" y="593">404</text><rect fill="#f3f6f8" height="38" stroke="#cbd5dd" width="520" x="640" y="569" /><text font-size="14" text-anchor="start" x="650" y="593">star(Y)</text><text fill="#526574" font-size="13" text-anchor="start" x="40" y="663">Committed research evidence · provisional colours · no Windows/DirectX or performance claim</text><metadata>{"command":"python3 -I -B research/jumbling/tutorial/figures/diagrams.py --only ch06-late-three-cycle","figure":"ch06-late-three-cycle","inputs":{"research/jumbling/tutorial/06-lattice.md":"60926dc4b5da84e4e314786e6996239de792d6d8db3566102268e3a1ed20eca7","research/jumbling/tutorial/figures/diagrams.py":"4999331eb3c77ec66b6af2cf989eaeaca63d2046e00340409826223b231e8008","research/jumbling/tutorial/records/ch06-examples.json":"795340cd03a95ec1133df289672d973bbf22deb038fa3c86eb9a91ac283105e8"},"notes":[],"tool":"Python 3.13.16; standard library SVG writer"}</metadata></svg>
