<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#172b3a" aria-labelledby="figure-title figure-description" height="1350" viewBox="0 0 1200 1350"><title id="figure-title">Figure 3.3: How next_step and _call classify a program's output</title><desc id="figure-description">from a program's lines to a sub-phase result at commit 35c3d4f: the order of the checks in _call and next_step, with the three zero-step ends that end in error</desc><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526574" /></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8054a2" /></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83" /></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b43c4c" /></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2469a0" /></marker></defs><rect fill="#ffffff" height="1350" width="1200" x="0" y="0" /><text font-size="23" font-weight="600" text-anchor="start" x="40" y="40">Figure 3.3: How next_step and _call classify a program's output</text><line stroke="#cbd5dd" stroke-width="1.5" x1="40" x2="1160" y1="60" y2="60" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="700" x="40" y="90" /><text font-size="15" text-anchor="middle" x="390" y="118.75">next_step: check height invariant; write snapshot; start the rule program</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="113.5" y2="113.5" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="340" x="820" y="90" /><text font-size="15" text-anchor="middle" x="990" y="118.75">height invariant fails → error</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="141" y2="162" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="700" x="40" y="165" /><text font-size="15" text-anchor="middle" x="390" y="193.75">_call 1: operator signal?</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="188.5" y2="188.5" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="340" x="820" y="165" /><text font-size="15" text-anchor="middle" x="990" y="193.75">yes → error / cancelled</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="216" y2="237" /><rect fill="#f3f6f8" height="68" rx="6" stroke="#cbd5dd" width="700" x="40" y="240" /><text font-size="15" text-anchor="middle" x="390" y="279.25">2: parse complete lines; stop at first STEP or h4 START with null target</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="274" y2="274" /><rect fill="#f3f6f8" height="68" rx="6" stroke="#cbd5dd" width="340" x="820" y="240" /><text font-size="15" text-anchor="middle" x="990" y="268.75">unknown tags skipped; malformed</text><text font-size="15" text-anchor="middle" x="990" y="289.75">payload retained as parse error</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="312" y2="333" /><rect fill="#f3f6f8" height="68" rx="6" stroke="#cbd5dd" width="700" x="40" y="336" /><text font-size="15" text-anchor="middle" x="390" y="375.25">3: verify START / CONTEXT digest and expected target, u and shard fields</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="370" y2="370" /><rect fill="#f3f6f8" height="68" rx="6" stroke="#cbd5dd" width="340" x="820" y="336" /><text font-size="15" text-anchor="middle" x="990" y="364.75">mismatch → digest_mismatch /</text><text font-size="15" text-anchor="middle" x="990" y="385.75">inconsistent_output</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="408" y2="429" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="700" x="40" y="432" /><text font-size="15" text-anchor="middle" x="390" y="460.75">4: first STEP? Or h4 START with null target?</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="455.5" y2="455.5" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="340" x="820" y="432" /><text font-size="15" text-anchor="middle" x="990" y="460.75">proposal; or stuck / no_target</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="483" y2="504" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="700" x="40" y="507" /><text font-size="15" text-anchor="middle" x="390" y="535.75">5: malformed, mismatch, missing_step or crash parse status?</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="530.5" y2="530.5" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="340" x="820" y="507" /><text font-size="15" text-anchor="middle" x="990" y="535.75">error before checking the clock</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="558" y2="579" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="700" x="40" y="582" /><text font-size="15" text-anchor="middle" x="390" y="610.75">6: shard DONE: FIRST indexes exactly its share of the order?</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="605.5" y2="605.5" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="340" x="820" y="582" /><text font-size="15" text-anchor="middle" x="990" y="610.75">failure → inconsistent_output</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="633" y2="654" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="700" x="40" y="657" /><text font-size="15" text-anchor="middle" x="390" y="685.75">7: wall clock killed the child?</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="680.5" y2="680.5" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="340" x="820" y="657" /><text font-size="15" text-anchor="middle" x="990" y="685.75">timeout / wall_clock</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="708" y2="729" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="700" x="40" y="732" /><text font-size="15" text-anchor="middle" x="390" y="781.75">8: normal exit and end line: START, step count, digest, target and u checks</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="776.5" y2="776.5" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="340" x="820" y="732" /><text font-size="15" text-anchor="middle" x="990" y="771.25">HEIGHT2 / HANDOFF → handoff; BUDGET</text><text font-size="15" text-anchor="middle" x="990" y="792.25">→ budget; UNLOCKED / STUCK → stuck</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="825" y2="846" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="700" x="40" y="849" /><text font-size="15" text-anchor="middle" x="390" y="877.75">9: SIGXCPU at the CPU limit?</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="872.5" y2="872.5" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="340" x="820" y="849" /><text font-size="15" text-anchor="middle" x="990" y="877.75">budget / cpu_rlimit</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="900" y2="921" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="700" x="40" y="924" /><text font-size="15" text-anchor="middle" x="390" y="952.75">10: remaining nonzero exit / traceback, or incomplete output</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="947.5" y2="947.5" /><rect fill="#f3f6f8" height="47" rx="6" stroke="#cbd5dd" width="340" x="820" y="924" /><text font-size="15" text-anchor="middle" x="990" y="952.75">error / crash, or truncated</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="975" y2="996" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="700" x="40" y="999" /><text font-size="15" text-anchor="middle" x="390" y="1038.25">next_step: STUCK with a target? r22d81 calls its pair program; h4 calls pair</text><text font-size="15" text-anchor="middle" x="390" y="1059.25">shards</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="1043.5" y2="1043.5" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="340" x="820" y="999" /><text font-size="15" text-anchor="middle" x="990" y="1038.25">otherwise return the sub-phase end;</text><text font-size="15" text-anchor="middle" x="990" y="1059.25">proposal → runner plays and verifies</text><rect fill="#f3f6f8" height="38" stroke="#cbd5dd" width="800" x="40" y="1116" /><text font-size="14" font-weight="600" text-anchor="start" x="50" y="1140">Zero-step program end at the chapter's pinned revision</text><rect fill="#f3f6f8" height="38" stroke="#cbd5dd" width="320" x="840" y="1116" /><text font-size="14" font-weight="600" text-anchor="start" x="850" y="1140">Actual result / reason</text><rect fill="#ffffff" height="38" stroke="#cbd5dd" width="800" x="40" y="1154" /><text font-size="14" text-anchor="start" x="50" y="1178">r22d81: START, BUDGET with 0 steps</text><rect fill="#ffffff" height="38" stroke="#cbd5dd" width="320" x="840" y="1154" /><text font-size="14" text-anchor="start" x="850" y="1178">error / malformed_output</text><rect fill="#f3f6f8" height="38" stroke="#cbd5dd" width="800" x="40" y="1192" /><text font-size="14" text-anchor="start" x="50" y="1216">pairs: START with u = 0, UNLOCKED with 0 steps</text><rect fill="#f3f6f8" height="38" stroke="#cbd5dd" width="320" x="840" y="1192" /><text font-size="14" text-anchor="start" x="850" y="1216">error / malformed_output</text><rect fill="#ffffff" height="38" stroke="#cbd5dd" width="800" x="40" y="1230" /><text font-size="14" text-anchor="start" x="50" y="1254">pairs: START, BUDGET with 0 steps</text><rect fill="#ffffff" height="38" stroke="#cbd5dd" width="320" x="840" y="1230" /><text font-size="14" text-anchor="start" x="850" y="1254">error / malformed_output</text><text fill="#526574" font-size="13" text-anchor="start" x="40" y="1324">Committed research evidence · provisional colours · no Windows/DirectX or performance claim</text><metadata>{"command":"python3 -I -B research/jumbling/tutorial/figures/diagrams.py --only 03-call-flow","figure":"03-call-flow","inputs":{"research/jumbling/tutorial/03-height.md":"3777b47906850cdfe5f0973168bab41e3a39c803814be089ce7397304f6295c9","research/jumbling/tutorial/figures/diagrams.py":"4999331eb3c77ec66b6af2cf989eaeaca63d2046e00340409826223b231e8008","research/jumbling/tutorial/records/ch03-examples.json":"e116e60087b2271f925656d0625d2c9c1873b5d89e2881a03ac7eaa3bdd512f1"},"notes":[],"tool":"Python 3.13.16; standard library SVG writer"}</metadata></svg>
