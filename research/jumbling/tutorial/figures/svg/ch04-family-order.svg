text font-size="15" text-anchor="start" x="40" y="117">exhausted. F1 → F2 → F3 runs for one unit, then repeats for the next unit.</text><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="700" x="40" y="156" /><text font-size="15" text-anchor="middle" x="390" y="184.75">F1 · some unit at height 6</text><text font-size="15" text-anchor="middle" x="390" y="205.75">Gate: protected lowering, h = 6</text><text font-size="15" text-anchor="middle" x="390" y="226.75">Letters: 1</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="200.5" y2="200.5" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="340" x="820" y="156" /><text font-size="15" text-anchor="middle" x="990" y="195.25">gate passes → proposal; no candidate</text><text font-size="15" text-anchor="middle" x="990" y="216.25">→ next family / unit</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="249" y2="270" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="700" x="40" y="273" /><text font-size="15" text-anchor="middle" x="390" y="301.75">F2 · same</text><text font-size="15" text-anchor="middle" x="390" y="322.75">Gate: protected lowering, h = 6</text><text font-size="15" text-anchor="middle" x="390" y="343.75">Letters: 3</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="317.5" y2="317.5" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="340" x="820" y="273" /><text font-size="15" text-anchor="middle" x="990" y="312.25">gate passes → proposal; no candidate</text><text font-size="15" text-anchor="middle" x="990" y="333.25">→ next family / unit</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="366" y2="387" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="700" x="40" y="390" /><text font-size="15" text-anchor="middle" x="390" y="418.75">F3 · same</text><text font-size="15" text-anchor="middle" x="390" y="439.75">Gate: protected lowering, h = 6</text><text font-size="15" text-anchor="middle" x="390" y="460.75">Letters: 4 or 6</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="434.5" y2="434.5" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="340" x="820" y="390" /><text font-size="15" text-anchor="middle" x="990" y="429.25">gate passes → proposal; no candidate</text><text font-size="15" text-anchor="middle" x="990" y="450.25">→ next family / unit</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="483" y2="504" /><rect fill="#f3f6f8" height="110" rx="6" stroke="#cbd5dd" width="700" x="40" y="507" /><text font-size="15" text-anchor="middle" x="390" y="535.75">d19 · the tier found nothing and some unit is at height 4</text><text font-size="15" text-anchor="middle" x="390" y="556.75">Gate: D19's strict′ replay, then strict landing with the height-6 pieces</text><text font-size="15" text-anchor="middle" x="390" y="577.75">exact</text><text font-size="15" text-anchor="middle" x="390" y="598.75">Letters: 6 to 244</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="562" y2="562" /><rect fill="#f3f6f8" height="110" rx="6" stroke="#cbd5dd" width="340" x="820" y="507" /><text font-size="15" text-anchor="middle" x="990" y="556.75">gate passes → proposal; no candidate</text><text font-size="15" text-anchor="middle" x="990" y="577.75">→ next family / unit</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="621" y2="642" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="700" x="40" y="645" /><text font-size="15" text-anchor="middle" x="390" y="673.75">S·T · same</text><text font-size="15" text-anchor="middle" x="390" y="694.75">Gate: protected lowering h = 4 for S; strict landing for T and for S·T</text><text font-size="15" text-anchor="middle" x="390" y="715.75">Letters: 2</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="689.5" y2="689.5" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="340" x="820" y="645" /><text font-size="15" text-anchor="middle" x="990" y="684.25">gate passes → proposal; no candidate</text><text font-size="15" text-anchor="middle" x="990" y="705.25">→ next family / unit</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="738" y2="759" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="700" x="40" y="762" /><text font-size="15" text-anchor="middle" x="390" y="790.75">T1 (blocker order) · families 1 to 3 found nothing</text><text font-size="15" text-anchor="middle" x="390" y="811.75">Gate: strict landing, every high piece exact</text><text font-size="15" text-anchor="middle" x="390" y="832.75">Letters: 1</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="806.5" y2="806.5" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="340" x="820" y="762" /><text font-size="15" text-anchor="middle" x="990" y="801.25">gate passes → proposal; no candidate</text><text font-size="15" text-anchor="middle" x="990" y="822.25">→ next family / unit</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="390" x2="390" y1="855" y2="876" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="700" x="40" y="879" /><text font-size="15" text-anchor="middle" x="390" y="907.75">none · –</text><text font-size="15" text-anchor="middle" x="390" y="928.75">Gate: –</text><text font-size="15" text-anchor="middle" x="390" y="949.75">Letters: stuck</text><line marker-end="url(#arrow-muted)" stroke="#526574" stroke-width="1.5" x1="740" x2="814" y1="923.5" y2="923.5" /><rect fill="#f3f6f8" height="89" rx="6" stroke="#cbd5dd" width="340" x="820" y="879" /><text font-size="15" text-anchor="middle" x="990" y="928.75">exhausted → kernel stuck</text><text font-size="15" text-anchor="start" x="40" y="996">Every family checks its clock: a stop returns budget with that family's cursor. An uncertain twist or classification, failed</text><text font-size="15" text-anchor="start" x="40" y="1017">composition, invalid D19 answer or other exception returns error. A missing D19 program returns unsupported / d19_missing. A</text><text font-size="15" text-anchor="start" x="40" y="1038">gate rejection tries the next candidate.</text><text fill="#526574" font-size="13" text-anchor="start" x="40" y="1091">Committed research evidence · provisional colours · no Windows/DirectX or performance claim</text><metadata>{"command":"python3 -I -B research/jumbling/tutorial/figures/diagrams.py --only ch04-family-order","figure":"ch04-family-order","inputs":{"research/jumbling/tutorial/04-high.md":"cf6542ebb850fd15a06bce7da7b61ec3e79001866f03d78b3485c2d68f7ee750","research/jumbling/tutorial/figures/diagrams.py":"4999331eb3c77ec66b6af2cf989eaeaca63d2046e00340409826223b231e8008"},"notes":[],"tool":"Python 3.13.16; standard library SVG writer"}</metadata></svg>
